name: check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # tsc ×2 + oxlint + vitest + vite build (qa, prod) + budgets + i18n scan
      - run: npm run check

      - name: sTressT subtree is byte-identical to the baseline
        run: npm run stresst:verify

      - name: Playwright browsers (cached by setup-node's npm cache; binaries below)
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - run: npx playwright install --with-deps chromium firefox webkit

      # Full suite on chromium + firefox (SwiftShader / Firefox WebGL prefs live in playwright.config.ts).
      - run: npm run e2e -- --project=chromium --project=firefox
        env:
          CI: "1"

      # webkit runs only the DOM specs (WebGL specs call test.skip there).
      - run: npm run e2e -- --project=webkit --grep "@dom"
        env:
          CI: "1"

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            apps/dilemma/playwright-report
            apps/dilemma/test-results
          retention-days: 7
